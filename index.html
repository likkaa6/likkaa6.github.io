<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Інтерактивний скринінг та клінічний аналіз: Рання діагностика залежності
    </title>

    <!-- Roboto Font & Material Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <!-- React & React DOM -->
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>

    <!-- Emotion (Обов'язкові залежності для Material UI v5) -->
    <script
      src="https://unpkg.com/@emotion/react@11/umd/emotion-react.umd.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/@emotion/styled@11/umd/emotion-styled.umd.min.js"
      crossorigin
    ></script>

    <!-- Babel Translator -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Material UI v5 (Зафіксована робоча версія) -->
    <script
      src="https://unpkg.com/@mui/material@5.15.15/umd/material-ui.production.min.js"
      crossorigin
    ></script>

    <style>
      html {
        font-size: 18px; /* Увеличен базовый размер шрифта */
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f4f6f9;
        font-family: "Roboto", sans-serif;
        color: #2c3e50;
        font-size: 1.2rem;
      }
      .hero-banner {
        background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
        color: white;
        padding: 50px 0;
        margin-bottom: 28px;
      }
      .card-hover {
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out;
      }
      .card-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      .question-card {
        border-left: 6px solid #1976d2;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const {
        ThemeProvider,
        createTheme,
        CssBaseline,
        AppBar,
        Toolbar,
        Typography,
        Container,
        Box,
        Paper,
        Grid,
        Button,
        Card,
        CardContent,
        Radio,
        RadioGroup,
        FormControlLabel,
        FormControl,
        Alert,
        AlertTitle,
        Chip,
        List,
        ListItem,
        ListItemIcon,
        ListItemText,
        Divider,
        Tab,
        Tabs,
        LinearProgress,
        CardHeader,
        Avatar,
      } = MaterialUI;

      // Настройка увеличенного шрифта (~1.5x)
      const theme = createTheme({
        palette: {
          primary: { main: "#1976d2" },
          secondary: { main: "#00897b" },
          warning: { main: "#ed6c02" },
          error: { main: "#d32f2f" },
          success: { main: "#2e7d32" },
          background: { default: "#f4f6f9" },
        },
        typography: {
          fontSize: 20,
          h4: { fontWeight: 700, fontSize: "2.6rem" },
          h5: { fontWeight: 700, fontSize: "2.1rem" },
          h6: { fontWeight: 600, fontSize: "1.75rem" },
          subtitle1: { fontWeight: 600, fontSize: "1.4rem" },
          subtitle2: { fontSize: "1.25rem" },
          body1: { fontSize: "1.25rem", lineHeight: 1.6 },
          body2: { fontSize: "1.15rem", lineHeight: 1.5 },
          button: { fontSize: "1.2rem", fontWeight: 600 },
          caption: { fontSize: "1.05rem" },
        },
      });

      const questionsData = [
        {
          id: 1,
          question:
            '1. Чи буває так, що ви чекаєте вечора/вихідних виключно заради того, щоб нарешті "розслабитися" за допомогою речовини чи таблетки?',
          insight:
            "Фіксація на очікуванні вживання як єдиного джерела дофаміну.",
        },
        {
          id: 2,
          question:
            '2. Чи ловили ви себе на думці: "Я можу кинути будь-якої миті, просто зараз не найкращий час"?',
          insight: "Ілюзія контролю та класичний психологічний захист.",
        },
        {
          id: 3,
          question:
            '3. Чи доводилося вам шукати "наукові" статті про користь вашого способу вживання, щоб виправдатися перед собою чи іншими?',
          insight: "Раціоналізація поведінки залежності.",
        },
        {
          id: 4,
          question:
            "4. Чи відчуваєте ви провину чи сором після вживання, але все одно повторюєте це через кілька днів?",
          insight:
            "Замкнене коло: Провина → Тривога → Вживання для зняття тривоги.",
        },
        {
          id: 5,
          question:
            '5. Чи з\'явилося у вас правило: "Сьогодні точно ні", яке ви порушуєте вже до вечора?',
          insight: "Втрата контролю та компульсивність.",
        },
        {
          id: 6,
          question:
            "6. Чи помічали ви, що без речовини/стимулятора ви стаєте нудним, роздратованим для оточуючих?",
          insight:
            "Зсув базового емоційного плато — людина твереза відчувається нижче за норму.",
        },
        {
          id: 7,
          question:
            '7. Чи відміняли ви зустрічі, спорт чи навчання, бо почувалися погано після "вчорашнього"?',
          insight:
            "Зміна пріоритетів: речовина починає диктувати графік життя.",
        },
        {
          id: 8,
          question:
            '8. Чи є у вас речовини чи ліки, які ви ховаєте в рюкзаку, машині чи кімнаті "про всяк випадок"?',
          insight:
            'Поведінка "страхування" — виникнення паніки за відсутності доступу.',
        },
        {
          id: 9,
          question:
            '9. Чи доводиться вам підвищувати "дозу" або змінювати речовину, бо стара вже "не вставляє так, як раніше"?',
          insight:
            "Наочна толерантність — десенсибілізація рецепторного апарату.",
        },
        {
          id: 10,
          question:
            "10. Чи ловили ви себе на тому, що брешете лікареві або друзям про реальну частоту та обсяги вживання?",
          insight: 'Формування "подвійного життя" та соціальної маски.',
        },
      ];

      function App() {
        const [tabValue, setTabValue] = React.useState(0);
        const [answers, setAnswers] = React.useState({});
        const [submitted, setSubmitted] = React.useState(false);

        const handleTabChange = (event, newValue) => {
          setTabValue(newValue);
        };

        const handleOptionChange = (qId, val) => {
          setAnswers((prev) => ({ ...prev, [qId]: val }));
        };

        const calculateScore = () => {
          return Object.values(answers).reduce(
            (acc, curr) => acc + (curr === "yes" ? 1 : 0),
            0,
          );
        };

        const answeredCount = Object.keys(answers).length;
        const score = calculateScore();

        const resetTest = () => {
          setAnswers({});
          setSubmitted(false);
        };

        return (
          <ThemeProvider theme={theme}>
            <CssBaseline />

            {/* Navigation Bar */}
            <AppBar position="static" elevation={2}>
              <Toolbar sx={{ py: 1 }}>
                <span
                  className="material-icons"
                  style={{ marginRight: 14, fontSize: 36 }}
                >
                  medical_services
                </span>
                <Typography
                  variant="h6"
                  component="div"
                  sx={{ flexGrow: 1, fontSize: "1.5rem" }}
                >
                  Медична лекція: Рання діагностика залежності
                </Typography>
                <Chip
                  label="Собко Ліка 4 курс 6 а група"
                  color="secondary"
                  size="medium"
                  sx={{ fontSize: "1rem", p: 1 }}
                />
                <Chip
                  label="Студентський проект"
                  color="secondary"
                  size="medium"
                  sx={{ fontSize: "1rem", p: 1, ml: 1 }}
                />
              </Toolbar>
            </AppBar>

            {/* Banner */}
            <Box className="hero-banner">
              <Container maxWidth="lg">
                <Typography variant="h4" gutterBottom>
                  Інтерактивний скринінг та клінічна презентація
                </Typography>
                <Typography
                  variant="subtitle1"
                  sx={{ opacity: 0.95, maxWidth: 900, fontSize: "1.35rem" }}
                >
                  Ресурс розроблено для виявлення високофункціональної
                  залежності на ранніх етапах, аналізу нейробіологічних
                  механізмів та надання маршруту допомоги пацієнтам.
                </Typography>
              </Container>
            </Box>

            <Container maxWidth="lg" sx={{ mb: 8 }}>
              {/* Tabs */}
              <Paper sx={{ mb: 4 }}>
                <Tabs
                  value={tabValue}
                  onChange={handleTabChange}
                  indicatorColor="primary"
                  textColor="primary"
                  variant="fullWidth"
                >
                  <Tab
                    icon={
                      <span className="material-icons" style={{ fontSize: 28 }}>
                        assignment
                      </span>
                    }
                    label={
                      <span style={{ fontSize: "1.2rem" }}>
                        1. Інтерактивний Тест
                      </span>
                    }
                  />
                  <Tab
                    icon={
                      <span className="material-icons" style={{ fontSize: 28 }}>
                        psychology
                      </span>
                    }
                    label={
                      <span style={{ fontSize: "1.2rem" }}>
                        2. Нейробіологія & Лекція
                      </span>
                    }
                  />
                  <Tab
                    icon={
                      <span className="material-icons" style={{ fontSize: 28 }}>
                        health_and_safety
                      </span>
                    }
                    label={
                      <span style={{ fontSize: "1.2rem" }}>
                        3. Маршрут допомоги & Поради
                      </span>
                    }
                  />
                </Tabs>
              </Paper>

              {/* TAB 1: QUESTIONNAIRE */}
              {tabValue === 0 && (
                <Box>
                  <Paper sx={{ p: 4, mb: 4 }}>
                    <Typography variant="h6" color="primary" gutterBottom>
                      Скринінгова анкета (10 життєвих запитань)
                    </Typography>
                    <Typography variant="body1" color="textSecondary" paragraph>
                      Цей опитувальник допомагає виявити перші неочевидні
                      симптоми та подолати анозогнозію (заперечення хвороби).
                      Дані відповіді не зберігаються та обробляються виключно у
                      вашому браузері.
                    </Typography>
                    <LinearProgress
                      variant="determinate"
                      value={(answeredCount / 10) * 100}
                      sx={{ height: 12, borderRadius: 6, mb: 1.5 }}
                    />
                    <Typography
                      variant="caption"
                      color="textSecondary"
                      sx={{ fontSize: "1.1rem" }}
                    >
                      Дано відповідей: {answeredCount} з 10
                    </Typography>
                  </Paper>

                  {questionsData.map((q) => (
                    <Card key={q.id} className="question-card card-hover">
                      <CardContent sx={{ p: 3 }}>
                        <Typography
                          variant="subtitle1"
                          sx={{ fontWeight: 600, mb: 1.5, fontSize: "1.35rem" }}
                        >
                          {q.question}
                        </Typography>
                        <FormControl component="fieldset">
                          <RadioGroup
                            row
                            value={answers[q.id] || ""}
                            onChange={(e) =>
                              handleOptionChange(q.id, e.target.value)
                            }
                          >
                            <FormControlLabel
                              value="yes"
                              control={
                                <Radio
                                  color="error"
                                  sx={{
                                    "& .MuiSvgIcon-root": { fontSize: 28 },
                                  }}
                                />
                              }
                              label={
                                <span style={{ fontSize: "1.25rem" }}>Так</span>
                              }
                              sx={{ mr: 4 }}
                            />
                            <FormControlLabel
                              value="no"
                              control={
                                <Radio
                                  color="success"
                                  sx={{
                                    "& .MuiSvgIcon-root": { fontSize: 28 },
                                  }}
                                />
                              }
                              label={
                                <span style={{ fontSize: "1.25rem" }}>Ні</span>
                              }
                            />
                          </RadioGroup>
                        </FormControl>
                        {answers[q.id] && (
                          <Box
                            sx={{
                              mt: 2,
                              p: 2,
                              bgcolor: "#f0f4f8",
                              borderRadius: 1.5,
                            }}
                          >
                            <Typography
                              variant="body2"
                              color="textSecondary"
                              sx={{
                                display: "flex",
                                alignItems: "center",
                                fontSize: "1.15rem",
                              }}
                            >
                              <span
                                className="material-icons"
                                style={{
                                  fontSize: 22,
                                  marginRight: 8,
                                  color: "#1976d2",
                                }}
                              >
                                info
                              </span>
                              <strong>Клінічний маркер:</strong> &nbsp;{" "}
                              {q.insight}
                            </Typography>
                          </Box>
                        )}
                      </CardContent>
                    </Card>
                  ))}

                  <Box sx={{ textAlign: "center", mt: 5 }}>
                    <Button
                      variant="contained"
                      size="large"
                      color="primary"
                      disabled={answeredCount < 10}
                      onClick={() => setSubmitted(true)}
                      startIcon={
                        <span
                          className="material-icons"
                          style={{ fontSize: 28 }}
                        >
                          analytics
                        </span>
                      }
                      sx={{ px: 5, py: 2, fontSize: "1.3rem" }}
                    >
                      Отримати висновок та розшифровку
                    </Button>
                  </Box>

                  {/* RESULTS SECTION */}
                  {submitted && (
                    <Paper
                      sx={{
                        p: 5,
                        mt: 5,
                        bgcolor: "#fff",
                        borderTop: "8px solid #1976d2",
                      }}
                      elevation={4}
                    >
                      <Typography
                        variant="h5"
                        gutterBottom
                        color="primary"
                        sx={{ display: "flex", alignItems: "center" }}
                      >
                        <span
                          className="material-icons"
                          style={{ marginRight: 12, fontSize: 40 }}
                        >
                          fact_check
                        </span>
                        Результати скринінгу
                      </Typography>

                      <Box sx={{ my: 3 }}>
                        <Chip
                          label={`Ваш результат: ${score} з 10 позитивних відповідей`}
                          color={
                            score >= 5
                              ? "error"
                              : score >= 2
                                ? "warning"
                                : "success"
                          }
                          sx={{ fontSize: "1.25rem", p: 2.5, height: "auto" }}
                        />
                      </Box>

                      {score <= 1 && (
                        <Alert
                          severity="success"
                          sx={{ mb: 3, fontSize: "1.15rem" }}
                        >
                          <AlertTitle sx={{ fontSize: "1.3rem" }}>
                            Низький рівень ризику (0–1 бал)
                          </AlertTitle>
                          Ознак формування залежності не виявлено. Ви зберігаєте
                          здорові копінг-механізми та контроль над поведінкою.
                        </Alert>
                      )}

                      {score >= 2 && score <= 4 && (
                        <Alert
                          severity="warning"
                          sx={{ mb: 3, fontSize: "1.15rem" }}
                        >
                          <AlertTitle sx={{ fontSize: "1.3rem" }}>
                            Помірний рівень / Початкові маркери (2–4 бали)
                          </AlertTitle>
                          Присутні ранні ознаки психологічного захисту
                          (раціоналізація, ілюзія контролю) або початкова
                          десенсибілізація рецепторного апарату. Зверніть увагу
                          на джерела зняття стресу.
                        </Alert>
                      )}

                      {score >= 5 && (
                        <Alert
                          severity="error"
                          sx={{ mb: 3, fontSize: "1.15rem" }}
                        >
                          <AlertTitle sx={{ fontSize: "1.3rem" }}>
                            Високий ризик високофункціональної залежності (5+
                            балів)
                          </AlertTitle>
                          Виявлено чіткі клінічні маркери: зсув базового
                          емоційного плато, зростання толерантності та
                          формування "подвійного життя". Рекомендовано анонімну
                          консультацію зі спеціалістом.
                        </Alert>
                      )}

                      <Divider sx={{ my: 4 }} />

                      <Typography variant="h6" gutterBottom>
                        Нейробіологічний та клінічний висновок:
                      </Typography>
                      <Typography
                        variant="body1"
                        paragraph
                        color="textSecondary"
                      >
                        Залежність у 21-му столітті починається не з "втрати
                        соціального дна", а з неочевидних змін: рання
                        десенсибілізація D2-дофамінових рецепторів та адаптація
                        глутаматергічної системи роблять тверезий стан відчутно
                        "нижчим за норму". Речовина перестає бути способом
                        отримати задоволення і стає єдиним інструментом
                        повернення до базового "нуля".
                      </Typography>

                      <Box
                        sx={{
                          mt: 4,
                          display: "flex",
                          gap: 3,
                          flexWrap: "wrap",
                        }}
                      >
                        <Button
                          variant="outlined"
                          color="primary"
                          size="large"
                          onClick={resetTest}
                          sx={{ px: 3, py: 1.5 }}
                        >
                          Пройти повторно
                        </Button>
                        <Button
                          variant="contained"
                          color="secondary"
                          size="large"
                          onClick={() => setTabValue(2)}
                          sx={{ px: 3, py: 1.5 }}
                        >
                          Переглянути контакти допомоги
                        </Button>
                      </Box>
                    </Paper>
                  )}
                </Box>
              )}

              {/* TAB 2: LECTURE / PRESENTATION CONTENT */}
              {tabValue === 1 && (
                <Box>
                  <Paper sx={{ p: 5, mb: 4 }}>
                    <Typography variant="h5" color="primary" gutterBottom>
                      А як виглядає пацієнт із залежністю на самому початку?
                    </Typography>
                    <Typography variant="body1" paragraph>
                      У підручниках нам часто показують крайні стадії. Але у
                      реальному житті 21-го століття наркоманія мімікрує. Вона
                      не починається з перебування у поганій компанії чи
                      нарко-притону.
                    </Typography>
                    <Typography
                      variant="body1"
                      paragraph
                      sx={{
                        fontWeight: 500,
                        color: "#1565c0",
                        fontSize: "1.3rem",
                      }}
                    >
                      Вона починається у кав'ярнях, на онлайн-лекціях, в
                      IT-офісах і, будьмо відвертими, серед студентів-медиків.
                      Це так звана{" "}
                      <strong>високофункціональна залежність</strong>.
                    </Typography>
                    <Typography variant="body1" color="textSecondary">
                      Щоб виявити її до того, як пацієнт потрапить у реанімацію
                      чи психіатрію, необхідно звертати увагу на 10 життєвих
                      запитань, які змушують людину визнати існування проблеми.
                    </Typography>
                  </Paper>

                  <Grid container spacing={4} sx={{ mb: 4 }}>
                    <Grid item xs={12} md={6}>
                      <Card sx={{ height: "100%", p: 1 }}>
                        <CardHeader
                          avatar={
                            <Avatar
                              sx={{ bgcolor: "#1976d2", width: 50, height: 50 }}
                            >
                              <span
                                className="material-icons"
                                style={{ fontSize: 30 }}
                              >
                                science
                              </span>
                            </Avatar>
                          }
                          title={
                            <Typography variant="h6">
                              Нейробіологія & Неочевидні симптоми
                            </Typography>
                          }
                        />
                        <CardContent>
                          <Typography variant="body1" paragraph>
                            З погляду нейробіології — це не просто «погана
                            звичка». Це{" "}
                            <strong>
                              рання десенсибілізація D2-дофамінових рецепторів
                            </strong>{" "}
                            та{" "}
                            <strong>адаптація глутаматергічної системи</strong>.
                          </Typography>
                          <Typography variant="body1" paragraph>
                            Мозок втрачає здатність отримувати задоволення від
                            базових стимулів — їжі, навчання, спорту. Наркотик
                            стає не способом отримати кайф, а єдиним
                            копінг-механізмом, щоб повернутися на рівень "нуля"
                            з мінусового емоційного стану.
                          </Typography>
                          <Typography variant="body1">
                            <strong>Анозогнозія</strong> — заперечення хвороби —
                            це перший клінічний симптом залежності. Якщо ми
                            шукатимемо лише сліди від ін'єкцій чи звужені
